name: Deploy API

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options: 
          - Stage
          - Production
        default: 'Stage'
  release: # Prod
    types: [released]
  push: # Stage
    branches:
      - main

jobs:
  deploy:
    environment: ${{ inputs.environment || github.event_name == 'release' && 'Production' || github.event_name == 'push' && 'Stage' }}
    name: Deploy to ${{ inputs.environment || github.event_name == 'release' && 'Production' || github.event_name == 'push' && 'Stage' }}
    # we would like to avoid running this workflow in forked repos
    if: github.repository == 'adobe/adp-template-registry-api'
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        node-version: ['20']
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm i --package-lock --package-lock-only && npm ci
      - name: Setup Adobe AIO CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ${{ matrix.os }}
          version: 10.x.x
      - name: Create .env file
        run: |
          echo "AIO_runtime_auth=${{ secrets.AIO_RUNTIME_AUTH }}" >> .env
          echo "AIO_runtime_namespace=${{ secrets.AIO_RUNTIME_NAMESPACE }}" >> .env
          echo "AIO_runtime_apihost=${{ secrets.AIO_RUNTIME_APIHOST }}" >> .env
      - name: Generate Template Registry APIs
        run: aio runtime api create --config-file=template-registry-api.json
      - name: Deploy
        env:
          TEMPLATE_REGISTRY_ORG: ${{ secrets.TEMPLATE_REGISTRY_ORG }}
          TEMPLATE_REGISTRY_REPOSITORY: ${{ secrets.TEMPLATE_REGISTRY_REPOSITORY }}
          ACCESS_TOKEN_GITHUB: ${{ secrets.ACCESS_TOKEN_GITHUB }}
          IMS_URL: ${{ secrets.IMS_URL }}
          IMS_CLIENT_ID: ${{ secrets.IMS_CLIENT_ID }}
          IMS_CLIENT_SECRET: ${{ secrets.IMS_CLIENT_SECRET }}
          IMS_AUTH_CODE: ${{ secrets.IMS_AUTH_CODE }}
          IMS_SCOPES: ${{ secrets.IMS_SCOPES }}
          ADMIN_IMS_ORGANIZATIONS: ${{ secrets.ADMIN_IMS_ORGANIZATIONS }}
          TEMPLATE_REGISTRY_API_URL: ${{ secrets.TEMPLATE_REGISTRY_API_URL }}
          MONGODB_NAME: ${{ secrets.MONGODB_NAME }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          METRICS_URL: ${{ secrets.METRICS_URL }}
        run: aio app deploy

  e2e-tests:
    # Verifies the newly deployed code on Stage by running the full e2e suite.
    # NOTE: Stage only for now. The scheduled "Smoke Tests" workflow had been disabled for all
    # environments (reason unknown), so tests are not re-introduced against Production yet.
    # Once Stage runs prove stable, extend this job to Production (e.g. `npm run test:smoke`).
    needs: deploy
    if: ${{ (inputs.environment || github.event_name == 'release' && 'Production' || github.event_name == 'push' && 'Stage') == 'Stage' }}
    environment: Stage
    name: E2E tests on Stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm i --package-lock --package-lock-only && npm ci
      - name: Run e2e tests
        env:
          E2E_TARGET: stage
          IMS_URL: ${{ secrets.IMS_URL }}
          IMS_CLIENT_ID: ${{ secrets.IMS_CLIENT_ID }}
          IMS_CLIENT_SECRET: ${{ secrets.IMS_CLIENT_SECRET }}
          IMS_AUTH_CODE: ${{ secrets.IMS_AUTH_CODE }}
          IMS_SCOPES: ${{ secrets.IMS_SCOPES }}
          TEMPLATE_REGISTRY_API_URL: ${{ secrets.TEMPLATE_REGISTRY_API_URL }}
        run: npm run e2e
      - name: Slack Notification
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: Stage Template Registry E2E Tests Failed
          SLACK_MESSAGE: 'Post-deploy e2e tests failed on Stage for ${{ github.sha }}.\n Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n Runbook: https://git.corp.adobe.com/CNA/runbooks/tree/main/runbooks/template-registry-smoke-tests-failure.md'
          SLACK_COLOR: danger
          ENABLE_ESCAPES: true
